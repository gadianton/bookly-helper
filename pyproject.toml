[project]
name = "bookly"
version = "0.1.0"
description = "Bookly customer support agent prototype"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "typesafe-sdk==0.7.2",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
